services:
  postgres:
    image: 'postgres:15.1-alpine'
    container_name: postgres
    ports:
      - "5437:5432"
    environment:
      - POSTGRES_DB=banking
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    networks:
      - banking
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: 'apache/kafka:latest'
    container_name: kafka
    ports:
      - '9092:9092'
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - CLUSTER_ID=Mk3OEYBSD3TbpWP0VODDVQ
    networks:
      - banking
    volumes:
      - kafka-data:/var/lib/kafka/data

  debezium:
    image: debezium/connect:2.4.0.Final
    container_name: debezium
    depends_on:
      - kafka
    restart: unless-stopped
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=2
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
    user: root
    networks:
      - banking
    volumes:
      - debezium-data:/debezium/data
      - ./conf/:/on-startup/

  debezium-init:
    image: curlimages/curl:latest
    container_name: debezium-init
    depends_on:
      - debezium
    restart: on-failure
    command: >
      sh -c "
        until curl -s http://debezium:8083/; do
          echo 'Waiting for Debezium REST API...';
          sleep 3;
        done;
        echo 'Debezium API ready. Registering postgres connector...';
        curl -i -X POST -H 'Accept:application/json' -H 'Content-Type:application/json' http://debezium:8083/connectors -d @/on-startup/postgres-connector.json || true;
      "
    networks:
      - banking
    volumes:
      - ./conf/:/on-startup/

  c-service:
    build:
      context: .
      dockerfile: ./c-service/Dockerfile
    container_name: c-service
    ports:
      - "5555:5555"
    restart: unless-stopped
    environment:
      - HOST=postgres:5432
      - POSTGRES_DB=banking
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - JWT_SECRET=enhnaGNmamJ4d2JhYmV3YmhjZWJqaGVzcnZrcnNlaGNyYmx3aGJjcmhiY2tzaGJjd2JocmVsYmFjcmhiZWthY2hy
      - JWT_ACCESS=10m
      - JWT_REFRESH=1h
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - banking

  event-handler:
    build:
      context: .
      dockerfile: ./event-handler/Dockerfile
    container_name: event-handler
    ports:
      - "8081:8081"
    restart: unless-stopped
    environment:
      - HOST=postgres:5432
      - POSTGRES_DB=banking
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - banking

networks:
  banking:
    driver: bridge

volumes:
  db-data:
    driver: local
  kafka-data:
    driver: local
  debezium-data:
    driver: local
